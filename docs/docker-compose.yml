services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bwtdallas-docs
    restart: unless-stopped

    # You asked for /app as the mount point, and docs at /app/docs:
    volumes:
      - /bwtdallas:/app

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # =========
      # (A) docs.bwtdallas.com -> serve the docs site
      # =========
      - traefik.http.routers.bwtdallas-docs.rule=Host(`docs.bwtdallas.com`)
      - traefik.http.routers.bwtdallas-docs.entrypoints=https
      - traefik.http.routers.bwtdallas-docs.tls=true
      - traefik.http.routers.bwtdallas-docs.tls.certresolver=cloudflare
      - traefik.http.services.bwtdallas-docs.loadbalancer.server.port=80

      # =========
      # (B) OPTIONAL: bwtdallas.com/docs -> redirect to docs.bwtdallas.com
      # =========
      - traefik.http.routers.bwtdallas-docs-redirect.rule=Host(`bwtdallas.com`) && PathPrefix(`/docs`)
      - traefik.http.routers.bwtdallas-docs-redirect.entrypoints=https
      - traefik.http.routers.bwtdallas-docs-redirect.tls=true
      - traefik.http.routers.bwtdallas-docs-redirect.tls.certresolver=cloudflare
      - traefik.http.routers.bwtdallas-docs-redirect.middlewares=docs-redirect@docker
      - traefik.http.middlewares.docs-redirect.redirectregex.regex=^https?://bwtdallas\.com/docs/?(.*)
      - traefik.http.middlewares.docs-redirect.redirectregex.replacement=https://docs.bwtdallas.com/$$1
      - traefik.http.middlewares.docs-redirect.redirectregex.permanent=true

networks:
  proxy:
    external: true
    name: proxy