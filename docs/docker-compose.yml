services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ebdallas-docs
    restart: unless-stopped

    # You asked for /app as the mount point, and docs at /app/docs:
    volumes:
      - /ebdallas:/app

    networks:
      - proxy

    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy

      # =========
      # (A) docs.ebdallas.com -> serve the docs site
      # =========
      - traefik.http.routers.ebdallas-docs.rule=Host(`docs.ebdallas.com`)
      - traefik.http.routers.ebdallas-docs.entrypoints=https
      - traefik.http.routers.ebdallas-docs.tls=true
      - traefik.http.routers.ebdallas-docs.tls.certresolver=cloudflare
      - traefik.http.services.ebdallas-docs.loadbalancer.server.port=80

      # =========
      # (B) OPTIONAL: ebdallas.com/docs -> redirect to docs.ebdallas.com
      # =========
      - traefik.http.routers.ebdallas-docs-redirect.rule=Host(`ebdallas.com`) && PathPrefix(`/docs`)
      - traefik.http.routers.ebdallas-docs-redirect.entrypoints=https
      - traefik.http.routers.ebdallas-docs-redirect.tls=true
      - traefik.http.routers.ebdallas-docs-redirect.tls.certresolver=cloudflare
      - traefik.http.routers.ebdallas-docs-redirect.middlewares=docs-redirect@docker
      - traefik.http.middlewares.docs-redirect.redirectregex.regex=^https?://ebdallas\.com/docs/?(.*)
      - traefik.http.middlewares.docs-redirect.redirectregex.replacement=https://docs.ebdallas.com/$$1
      - traefik.http.middlewares.docs-redirect.redirectregex.permanent=true

networks:
  proxy:
    external: true
    name: proxy